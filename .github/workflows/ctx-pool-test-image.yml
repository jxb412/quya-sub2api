name: Ctx pool test image

on:
  push:
    branches: ['feat/ctx-pool-http-ws', 'merge/upstream-0.2.24-ctxpool']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ctx-pool-test-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      renewal-postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: quya_renewal_test
          POSTGRES_USER: renewal_test
          POSTGRES_PASSWORD: renewal_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U renewal_test -d quya_renewal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify HTTP to WS transport regressions
        working-directory: backend
        run: go test -tags=unit ./internal/service -run 'Test.*(HTTPWS|CtxPool|OpenAIWS|OpenAIClientTransport|OpenAIUpstreamTransport|OpenAIPlugin|CodexStable|PrependCodexStable|ApplyCodexOAuthTransform|ExtractSystemMessagesFromInput|ForcedCodexInstructions)' -count=1
      - name: Verify risk-control account scope
        working-directory: backend
        run: go test -tags=unit ./internal/service -run 'Test.*ContentModeration.*(Account|Plan|Scope)' -count=1
      # 2026-11-26: gate publication on the per-group zero-added-prompt policy,
      # including real PostgreSQL persistence and the lightweight auth SELECT.
      - name: Verify zero-added-prompt forwarding and management
        working-directory: backend
        run: |
          go test -tags=unit ./internal/service ./internal/handler/admin ./internal/handler/dto -run 'ZeroPrompt' -count=1 -timeout=240s
          go test ./internal/pkg/apicompat ./migrations -count=1 -timeout=120s
      - name: Verify zero-added-prompt PostgreSQL persistence
        working-directory: backend
        run: go test -tags=integration ./internal/repository -run '^TestGroupZeroPromptInjectionPersistsAndReachesAuthProjection$' -count=1 -timeout=240s -v
      - name: Verify Gemini Neon and Hydrogen support
        working-directory: backend
        run: go test -tags=unit ./internal/service -run 'TestGeminiNeon|TestGeminiImplicitCaching|TestDefaultPricingIncludesGeminiNeon|TestCodexAntigravityTier|TestGemini4ThinkingVariants' -count=1
      - name: Verify shared Redis startup preserves peer requests
        working-directory: backend
        run: go test -tags=unit ./internal/repository -run 'Test.*(Startup|CleanupStaleProcess|Live)' -count=1
      - name: Verify Codex standalone context compatibility
        working-directory: backend
        run: go test -tags=unit ./internal/handler -run 'TestNormalizeCodex|TestCodexCallOutputGate' -count=1
      # 2026-11-24: paid renewals need real row-lock/rollback coverage before an image is published.
      - name: Verify subscription renewal activation
        working-directory: backend
        run: go test -tags=unit ./internal/service ./internal/repository ./internal/handler ./internal/handler/admin ./internal/server/routes -run 'Test.*(Renewal|SubscriptionReset|NativeSubscription|NativeReset|LegacyStore|StoreLegacy|Subscription.*Cache|BillingCacheFixedCharge|FinalizeSubscriptionBilling|BulkSubscriptionAction)' -count=1
      - name: Verify renewal transactions against isolated PostgreSQL
        working-directory: backend
        env:
          QUYA_RENEWAL_TEST_DSN: postgres://renewal_test:renewal_test_ci@localhost:5432/quya_renewal_test?sslmode=disable
        run: go test ./internal/repository -run '^Test(RenewalPostgres|NativeResetPostgres|LegacyStorePostgres)' -count=1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image identity
        id: image
        env:
          SOURCE_SHA: ${{ github.sha }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          echo "tag=ghcr.io/${REPO_OWNER,,}/sub2api:ctx-pool-${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          # 2026-11-20: use the merged Quya release version so test images do not retain an old release label.
          release_version="$(tr -d '\r\n' < backend/cmd/server/VERSION)"
          echo "version=${release_version}-ctxpool.${SOURCE_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tag }}
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
            COMMIT=${{ github.sha }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=ctx-pool-amd64
          cache-to: type=gha,mode=max,scope=ctx-pool-amd64
      - name: Record test image
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Image: `%s`\n\nDigest: `%s`\n' "$IMAGE_TAG" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
