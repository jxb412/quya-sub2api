// Vendored from hashicorp/go-plugin v1.8.0 (internal/plugin/grpc_broker.proto).
// The broker enables bidirectional sub-connections; the Sub2API transport
// contract never uses it, so this plugin only parks the stream.
syntax = "proto3";
package plugin;
option go_package = "./plugin";

message ConnInfo {
  uint32 service_id = 1;
  string network = 2;
  string address = 3;
  message Knock {
    bool knock = 1;
    bool ack = 2;
    string error = 3;
  }
  Knock knock = 4;
}

service GRPCBroker {
  rpc StartStream(stream ConnInfo) returns (stream ConnInfo);
}
